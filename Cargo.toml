[package]
name = "tenover"
version = "0.6.1"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Client library for the Garmin R10 launch monitor BLE/GFDI/protobuf protocol"
repository = "https://github.com/divotmaker/10over"
readme = "README.md"
keywords = ["garmin", "r10", "golf", "launch-monitor"]
categories = ["network-programming", "parser-implementations"]

[features]
default = ["ble"]
# The platform BLE transport: BlueZ on Linux, btleplug elsewhere.
ble = [
    "dep:zbus",
    "dep:libc",
    "dep:btleplug",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:uuid",
]
serde = ["dep:serde"]
# The driver's settings (`config::Config`), with no BLE stack.
config = ["dep:flightrelay", "flightrelay/config", "serde"]
# The flightrelay `DeviceDriver` for the R10 (`driver::R10`).
driver = ["config", "ble", "flightrelay/driver"]
# The `tenover-frp` binary: the driver served over FRP.
frp = ["driver", "flightrelay/server", "flightrelay/main"]
# Frame builders with synthetic device identity, for downstream tests.
testing = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
prost = "0.13"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
flightrelay = { version = "0.6.0", default-features = false, optional = true }

# BLE backend deps are optional and target-conditional: the `ble` feature
# (default) turns them on, and only the right platform's deps are compiled.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
btleplug = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"], optional = true }
tokio-stream = { version = "0.1", optional = true }
uuid = { version = "1", optional = true }

[[bin]]
name = "tenover-frp"
required-features = ["frp"]

[[example]]
name = "r10"
required-features = ["ble"]

[dev-dependencies]
serde_json = "1"

[build-dependencies]
prost-build = "0.13"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
